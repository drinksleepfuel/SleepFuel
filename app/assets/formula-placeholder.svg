<svg width="1000" height="1200" viewBox="0 0 1000 1200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Image placeholder">
  <defs>
    <radialGradient id="bg" cx="38%" cy="26%" r="95%">
      <stop offset="0%" stop-color="#4a5578"/>
      <stop offset="55%" stop-color="#2a3147"/>
      <stop offset="100%" stop-color="#181b27"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="1200" fill="url(#bg)"/>

  <!-- soft glow behind the moon -->
